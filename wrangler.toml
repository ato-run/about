name = "about-ato-run"
main = "worker.js"
compatibility_date = "2026-08-24"
workers_dev = false

[[routes]]
pattern = "about.ato.run"
custom_domain = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/presence"]

[durable_objects]
bindings = [{ name = "ABOUT_PRESENCE_ROOM", class_name = "AboutPresenceRoom" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AboutPresenceRoom"]
